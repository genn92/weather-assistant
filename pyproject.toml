[project]
name = "weather-assistant"
version = "0.1.0"
description = "基于 DeepSeek + Streamlit 的天气查询 Agent"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "openai>=2.53.0",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "streamlit>=1.60.0",
]

[project.scripts]
weather-assistant = "weather_assistant.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/weather_assistant"]
